<!doctype html>
<html lang="<!-- figma:lang -->" translate="no">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El traductor automático de Chrome reescribe nodos de texto por fuera
         del control de React; cuando React vuelve a tocar esos mismos nodos
         (por ejemplo al terminar un giro de la ruleta) lanza un
         "NotFoundError: insertBefore" porque el DOM real ya no coincide con
         lo que React espera. El sitio ya está en español, así que no hay
         nada que traducir -- se desactiva para evitar ese choque. -->
    <meta name="google" content="notranslate" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
