# Nginx interno del contenedor -- sirve el build estatico de Vite y hace de
# proxy hacia la API real (servicio `api` de docker-compose.yml, mismo
# network de Docker). Sin TLS propio: lo termina el Nginx del host.
server {
    listen 80;
    server_name _;

    # Sonda del HEALTHCHECK del Dockerfile.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    root /usr/share/nginx/html;
    index index.html;

    # Proxy hacia la API real. El nombre `api` lo resuelve el DNS interno de
    # Docker Compose -- solo funciona porque `web` y `api` comparten la red
    # `casino` (ver docker-compose.yml). Con esto el navegador solo conoce
    # "/api/...", nunca el host/puerto real del backend, y todo queda en el
    # mismo origen (sin CORS que configurar en produccion).
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: el unico archivo real es index.html. Sin este try_files, entrar
    # directo a /admin o recargar estando ahi da 404 y el bundle de React
    # nunca llega a cargar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre -- cache para siempre.
    # index.html NO: es el que apunta a los hashes nuevos tras cada deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
