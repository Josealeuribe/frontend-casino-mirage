# Nginx interno del contenedor -- sirve el build estatico de Vite. Sin TLS
# (lo termina el Nginx del host) y sin proxy a ninguna API (este frontend no
# llama a ningun backend hoy).
server {
    listen 80;
    server_name _;

    # Sonda del HEALTHCHECK del Dockerfile.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: el unico archivo real es index.html. Sin este try_files, entrar
    # directo a /admin o recargar estando ahi da 404 y el bundle de React
    # nunca llega a cargar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre -- cache para siempre.
    # index.html NO: es el que apunta a los hashes nuevos tras cada deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
